
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch | Detalhes</title>
    <link rel="stylesheet" href="../css/detalhes.css">
</head>
<body>

    <header class="cabecalho">
        <a href="catalogo.html" class="logo">CineMatch</a>

        <nav>
            <a href="catalogo.html">Início</a>
            <a href="favoritos.html">Favoritos</a>
            <a href="minhaLista.html">Minha lista</a>
            <a href="perfil.html">Perfil</a>
        </nav>
    </header>

    <main>
        <section id="detalhesFilme" class="detalhes-filme">
            <p>Carregando informações do filme...</p>
        </section>

        <section class="secao-avaliacoes">
            <h2>Avaliações</h2>

            <form id="formAvaliacao">
                <label for="nota">Sua nota</label>

                <select id="nota" required>
                    <option value="">Selecione</option>
                    <option value="5">5 - Excelente</option>
                    <option value="4">4 - Muito bom</option>
                    <option value="3">3 - Bom</option>
                    <option value="2">2 - Regular</option>
                    <option value="1">1 - Ruim</option>
                </select>

                <label for="comentario">Comentário</label>
                <textarea
                    id="comentario"
                    placeholder="O que você achou desse filme?"
                    rows="4"
                ></textarea>

                <button type="submit">Enviar avaliação</button>
                <p id="mensagemAvaliacao"></p>
            </form>

            <div id="listaAvaliacoes">
                <p>Carregando avaliações...</p>
            </div>
        </section>
    </main>

    <script src="../script/api.js"></script>
    <script src="../script/detalhes.js"></script>
</body>
</html>
